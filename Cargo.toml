[package]
name = "kino"
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"

[dependencies]
anyhow = "1.0.104"
lazy_static = "1.5.0"
poise = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serenity = { version = "0.12.5", default-features = false, features = [
  "client",
  "gateway",
  "rustls_backend",
  "model",
  "builder",
  "cache",
] }
sqlx = { version = "0.9.0", features = [
  "derive",
  "chrono",
  "macros",
  "runtime-tokio",
  "sqlite",
  "migrate",
] }
tokio = { version = "1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
